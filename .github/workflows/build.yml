name: Build Windows Executable

on:
  push:
    branches: [main, master, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows ${{ matrix.architecture }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            python-version: '3.11.9'
            requirements: requirements.txt
            bits: 64
          - architecture: x86
            python-version: '3.8.10'
            requirements: requirements-win-x86.txt
            bits: 32

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: |
            ${{ matrix.requirements }}
            requirements-build.txt

      - name: Install pinned binary dependencies
        run: |
          python -m pip install --only-binary=:all: -r ${{ matrix.requirements }} -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import struct; assert struct.calcsize('P') * 8 == ${{ matrix.bits }}"

      - name: Verify conversion and startup behavior
        run: python -m unittest discover -s tests -v

      - name: Verify source export dependencies
        run: python run.py --self-test --report test-reports/source-self-test.json

      - name: Build portable desktop application
        env:
          PYTHONIOENCODING: utf-8
        run: python build.py

      - name: Verify packaged Windows application
        run: ./scripts/verify_windows.ps1 -ExpectedBits ${{ matrix.bits }}

      - name: Audit shipped runtime files
        run: python scripts/package_manifest.py

      - name: Build single Windows installer
        run: ./scripts/build_installer.ps1 -Architecture ${{ matrix.architecture }}

      - name: Verify installation and installed application
        run: ./scripts/verify_installer.ps1 -Architecture ${{ matrix.architecture }} -ExpectedBits ${{ matrix.bits }}

      - name: Record package information
        shell: pwsh
        run: |
          $installer = 'H5ToExcelConverter-Setup-${{ matrix.architecture }}.exe'
          $hash = (Get-FileHash "dist/$installer" -Algorithm SHA256).Hash.ToLower()
          "$hash  $installer" | Set-Content -Path "dist/$installer.sha256" -Encoding utf8
          python -m pip freeze | Set-Content test-reports/dependencies.txt
          $gui = Get-Content test-reports/packaged-smoke-test.json | ConvertFrom-Json
          $manifest = Get-Content test-reports/package-manifest.json | ConvertFrom-Json
          $size = [math]::Round((Get-Item "dist/$installer").Length / 1MB, 1)
          $installedSize = [math]::Round($manifest.bytes / 1MB, 1)
          @"
          ### Windows ${{ matrix.architecture }}
          - Installer: ``$installer`` ($size MiB)
          - Installed application: $installedSize MiB / $($manifest.file_count) runtime files
          - Desktop smoke test: passed ($($gui.process_wall_seconds) s; scientific libraries loaded: $($gui.scientific_libraries_loaded))
          - Packaged and installed HDF5 → Excel / CSV: passed
          - SHA256: ``$hash``
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload single installer
        uses: actions/upload-artifact@v7
        with:
          name: H5ToExcelConverter-Setup-${{ matrix.architecture }}
          path: |
            dist/H5ToExcelConverter-Setup-${{ matrix.architecture }}.exe
            dist/H5ToExcelConverter-Setup-${{ matrix.architecture }}.exe.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      # GitHub creates the ZIP itself: do not put another application ZIP inside.
      - name: Upload complete portable application
        uses: actions/upload-artifact@v7
        with:
          name: H5ToExcelConverter-Windows-${{ matrix.architecture }}
          path: dist/H5ToExcelConverter/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Windows-verification-${{ matrix.architecture }}
          path: test-reports/
          if-no-files-found: warn
          retention-days: 30
